---
- name: Create storage class for /fast
  k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: exascaler-sc-fast
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: exa.csi.ddn.com
      mountOptions:
        # - noatime
      parameters:
        projectId: "{{ hostvars[groups['kube_worker'][0]].project_id.stdout_lines[0].split(' ')[0] }}"
        exaMountUid: "{{ mdxuser_uid | int }}"
        bindMount: "false"
        exaFS: "172.17.8.40@{{ lustre_net }}:172.17.8.41@{{ lustre_net }}:/fast"
        mountPoint: "/fast"
        mountOptions: "network={{ lustre_net }},flock,noauto,defaults"

- name: Create storage class for /large
  k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: exascaler-sc-large
      provisioner: exa.csi.ddn.com
      mountOptions:
        # - noatime
      parameters:
        projectId: "{{ hostvars[groups['kube_worker'][0]].project_id.stdout_lines[0].split(' ')[0] }}"
        exaMountUid: "{{ mdxuser_uid | int }}"
        bindMount: "false"
        exaFS: "172.17.8.56@{{ lustre_net }}:172.17.8.57@{{ lustre_net }}:/large"
        mountPoint: /large
        mountOptions: "network={{ lustre_net }},flock,noauto,defaults"
