---
- name: Create apt keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Add NVIDIA Container Toolkit signing key
  get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: '0644'
  become: yes

- name: Register NVIDIA Container Toolkit repository
  copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    content: |
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
  become: yes

# The old nvidia-container-runtime repository has no list for Ubuntu 24.04 (404).
- name: Remove old nvidia-container-runtime repository
  file:
    path: /etc/apt/sources.list.d/nvidia-container-runtime.list
    state: absent
  become: yes

# nvidia-container-toolkit-base provides the nvidia-container-runtime binary.
- name: Install NVIDIA Container Toolkit
  apt:
    name:
      - nvidia-container-toolkit={{ nvidia_container_toolkit_version }}
      - nvidia-container-toolkit-base={{ nvidia_container_toolkit_version }}
      - libnvidia-container-tools={{ nvidia_container_toolkit_version }}
      - libnvidia-container1={{ nvidia_container_toolkit_version }}
    update_cache: yes
  become: yes

- name: Generate default config file
  # Use k0s's bundled containerd to generate the config. The system containerd
  # (installed from the nvidia repo) emits config `version = 3` on newer
  # releases, which k0s's bundled containerd (1.7.x, max version 2) cannot load
  # -> containerd crash-loops and the node never becomes Ready.
  shell:
    cmd: /var/lib/k0s/bin/containerd config default > /etc/k0s/containerd.toml
  become: yes

- name: Rewrite containerd.toml (1)
  replace:
    path: /etc/k0s/containerd.toml
    regexp: 'root = "/var/lib/containerd"'
    replace: 'root = "/var/lib/k0s/containerd"'
  become: yes

- name: Rewrite containerd.toml (2)
  replace:
    path: /etc/k0s/containerd.toml
    regexp: 'state = "/run/containerd"'
    replace: 'state = "/var/lib/k0s/run/containerd"'
  become: yes

- name: Rewrite containerd.toml (3)
  replace:
    path: /etc/k0s/containerd.toml
    regexp: 'address = "/run/containerd/containerd.sock"'
    replace: 'address = "/var/lib/k0s/run/containerd.sock"'
  become: yes

- name: Rewrite containerd.toml (4)
  replace:
    path: /etc/k0s/containerd.toml
    after: '[plugins."io.containerd.grpc.v1.cri".containerd]'
    regexp: 'default_runtime_name = "runc"'
    replace: 'default_runtime_name = "nvidia"'
  become: yes

- name: Rewrite containerd.toml (5)
  blockinfile:
    path: /etc/k0s/containerd.toml
    insertbefore: '\[plugins."io.containerd.grpc.v1.cri".containerd.untrusted_workload_runtime\]'
    block: |
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.nvidia]
            runtime_type = "io.containerd.runc.v2"
            runtime_engine = ""
            runtime_root = ""
            privileged_without_host_devices = false
            base_runtime_spec = ""
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.nvidia.options]
              BinaryName = "nvidia-container-runtime"
  become: yes

- name: Restart k0s worker
  systemd:
    name: k0sworker
    state: restarted
  become: yes
