---
# Settings of one environment (inventories/<env>/).
# check_env.yaml checks them before every run.

# Same as the directory name under inventories/.
env_name: example
# true for production. Then every run needs "-e confirm_env=<env_name>".
env_protected: false

ansible_user: mdxuser
mdxuser_home: /home/mdxuser
mdxuser_uid: 1000 #TODO: id -u

internal_domain: internal
roce_suffix: roce

registry_server: 'harbor.{{ internal_domain}}'

# Lustre network: tcp10 when the storage network is "仮想NIC（自動）",
# o2ib10 when it is "SR-IOV" (mdx docs 7.5.1).
lustre_net: tcp10

# static: node IPs are set by hand, in the host range 1-100 of the segment
#         (mdx docs 12.3.1). The common role checks this.
# dhcp:   node IPs come from DHCP. A timer keeps the kubelet node-ip up to date.
node_ip_mode: static

# Pod and Service networks of Kubernetes. They must not overlap with the networks
# of the mdx project (service and storage networks in the user portal).
# When both are left out, k0sctl uses the generated k0s config (same values).
k8s_pod_cidr: 10.244.0.0/16
k8s_service_cidr: 10.96.0.0/12

# Kubernetes version. The defaults are in roles/k8s/defaults/main.yaml.
# To use another version, set all three together.
# k0s_version: v1.xx.y+k0s.z
# kubectl_version: v1.xx.y
# kubectl_checksum: <sha256 of the kubectl binary>
