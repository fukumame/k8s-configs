# Inventory of one environment. Copy inventories/example/ to inventories/<env>/
# and fill in the addresses. The hosts.ini of each environment is not stored in git.

[bastion_host:vars]
ansible_python_interpreter=/home/mdxuser/k8s-configs/.venv/bin/python

[bastion_host]
bastion ansible_host=

[registry]
; harbor ansible_host=

[kube_master]
kube-master ansible_host=

[kube_node]
kube-node1 ansible_host= roce_host=
kube-node2 ansible_host= roce_host=

[kube_gpu]
kube-gpu1 ansible_host= roce_host=
kube-gpu2 ansible_host= roce_host=

[kube_worker:children]
kube_node
kube_gpu

# nginx in front of Kourier, with TLS and API keys (tag "entry_proxy").
# It can be the bastion host.
[entry_proxy]
; bastion

[kube_cluster:children]
kube_master
kube_worker

# roce_host / roce_netif: IPv4 address and interface of "ストレージネットワーク1".
# Check them with "ip -br addr". The names below are from the current cluster (virtual NIC).
[kube_master:vars]
roce_netif = ens192

[kube_node:vars]
roce_netif = ens192

[kube_gpu:vars]
roce_netif = ens224
